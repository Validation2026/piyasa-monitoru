<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3b82f6">
    <title>Tarım Emtiaları — Risk Monitörü</title>
    <meta name="description" content="Buğday, kahve, kakao ve 13 tarım emtiası — anlık fiyatlar ve grafikler">
    <meta property="og:title" content="Tarım Emtiaları — Risk Monitörü">
    <meta property="og:description" content="Buğday, kahve, kakao ve 13 tarım emtiası — anlık fiyatlar ve grafikler">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="tr_TR">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%233b82f6'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white'>📊</text></svg>">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        /* ══════════════════════════════════════════
           PREMIUM SAYFA ANİMASYONLARI
           ══════════════════════════════════════════ */
        
        /* 1. Şelale (Cascade) Giriş Animasyonu */
        @keyframes slideUpFade { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        /* Sayfa yüklenirken elemanlar sırayla düşsün */
        .page-head { opacity: 0; animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 0.1s; }
        .ai-box { opacity: 0; animation: slideUpFade 0.6s ease-out forwards; animation-delay: 0.2s; }
        .summary-row { opacity: 0; animation: slideUpFade 0.6s ease-out forwards; animation-delay: 0.3s; }
        .global-timeframes { opacity: 0; animation: slideUpFade 0.6s ease-out forwards; animation-delay: 0.4s; }
        .charts { opacity: 0; animation: slideUpFade 0.6s ease-out forwards; animation-delay: 0.5s; }
        .dtable { opacity: 0; animation: slideUpFade 0.6s ease-out forwards; animation-delay: 0.6s; }
        .footer { opacity: 0; animation: slideUpFade 0.6s ease-out forwards; animation-delay: 0.7s; }

        /* 2. Nefes Alan (Pulse) AI Rozeti */
        @keyframes breathBadge { 
            0% { box-shadow: 0 0 0 0 rgba(167,139,250,0.4); } 
            70% { box-shadow: 0 0 0 6px rgba(167,139,250,0); } 
            100% { box-shadow: 0 0 0 0 rgba(167,139,250,0); } 
        }
        .ai-breath { animation: breathBadge 2s infinite; }
    </style>
</head>
<body>
<script src="assets/js/sidebar.js"></script>
<div class="page">
<div class="page-spacer"></div>
    <div class="page-head">
        <h1>🌾 Tarım Emtiaları</h1>
        <div class="sub"></div>
        <div class="update-info" id="updateInfo"></div>
    </div>
    
    <div class="ai-box">
        <div class="ai-header">
            <span>🤖 AI Piyasa Analizi</span>
            <span class="ai-badge ai-breath">AI</span>
        </div>
        <div class="ai-body" id="aiAnalysis"><span class="ai-loading">Analiz yükleniyor...</span></div>
    </div>
    
    <div class="summary-row" id="summaryCards"></div>
    <div class="chart-timeframes global-timeframes">
        <button class="tf-btn" data-tf="1A">1A</button>
        <button class="tf-btn" data-tf="3A">3A</button>
        <button class="tf-btn" data-tf="6A">6A</button>
        <button class="tf-btn" data-tf="YTD">YTD</button>
        <button class="tf-btn" data-tf="1Y">1Y</button>
        <button class="tf-btn" data-tf="2Y">2Y</button>
        <button class="tf-btn" data-tf="3Y">3Y</button>
        <button class="tf-btn" data-tf="5Y">5Y</button>
        <button class="tf-btn active" data-tf="Tümü">Tümü</button>
    </div>
    <div class="charts" id="chartsGrid"></div>
    <div class="dtable" id="dataTable"></div>
    <div class="footer">Risk Monitörü © 2026</div>
</div>
<script src="assets/js/app.js"></script>
<script>
(function(){
    // Grafikleri sayfa yüklendiğinde ufak animasyonla çizmesi için ekstra şıklık
    Chart.defaults.animation.duration = 1000;
    Chart.defaults.animation.easing = 'easeOutQuart';

    var period='5y',allSeries=[],charts=[];
    PM.loadData('commodities_agriculture.json','emtia-tarim').then(function(data){
        if(!data||!data.series||!data.series.length){document.getElementById('summaryCards').innerHTML='<div class="scard"><div class="scard-name">Veri bulunamadı.</div></div>';return}
        allSeries=data.series;
        var ui=document.getElementById('updateInfo');
        if(ui&&data.meta)ui.textContent='Son güncelleme: '+new Date(data.meta.updated_at).toLocaleString('tr-TR')+' \u00b7 '+data.meta.symbol_count+' seri';
        PM.buildSummary('summaryCards',allSeries);
        charts=PM.buildCharts('chartsGrid',allSeries,period);
        PM.buildTable('dataTable',allSeries);
    });
    fetch('/api/ai-analysis?cat=emtia-tarim').then(function(r){return r.json()}).then(function(d){
        var el=document.getElementById('aiAnalysis');if(el&&d.analysis)el.textContent=d.analysis;
    }).catch(function(){var el=document.getElementById('aiAnalysis');if(el)el.innerHTML='<span class="ai-loading">Analiz yüklenemiyor.</span>'});
})();
</script>
</body>
</html>
