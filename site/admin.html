<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui;background:#f0f4f8;color:#0f172a;padding:20px}
.c{max-width:560px;margin:0 auto}
h1{font-size:1.2rem;font-weight:800;margin-bottom:14px}
.card{background:#fff;border:1px solid #dde4ed;border-radius:10px;padding:14px;margin-bottom:12px}
.ct{font-size:.65rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
label{font-size:.68rem;font-weight:600;color:#64748b;display:block;margin-bottom:3px}
input,select{width:100%;border:1px solid #dde4ed;border-radius:6px;padding:7px 9px;font-size:.82rem;outline:none;background:#f8fafc;margin-bottom:6px}
input:focus,select:focus{border-color:#3b82f6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row4{display:grid;grid-template-columns:1fr .6fr .6fr .6fr auto;gap:4px;margin-bottom:4px;align-items:end}
.btn{background:#ff4757;color:#fff;border:none;border-radius:8px;padding:11px;font-weight:800;font-size:.82rem;cursor:pointer;width:100%;margin-top:6px}
.btn:hover{background:#e83e4e}
.btn-sm{background:#64748b;color:#fff;border:none;border-radius:4px;padding:4px 8px;font-size:.62rem;font-weight:700;cursor:pointer}
.btn-del{background:#fee2e2;color:#dc2626;border:none;border-radius:4px;padding:5px 7px;cursor:pointer;font-weight:700;font-size:.8rem}
.status{text-align:center;margin-top:8px;font-size:.75rem;color:#64748b}
</style>
</head>
<body>
<div class="c">
<h1>⚙️ İran Risk — Admin</h1>

<div class="card">
<label>PIN</label>
<input type="password" id="pin" placeholder="PIN">
</div>

<div class="card">
<div class="ct">Risk Ayarları</div>
<div class="row">
<div><label>Risk Skoru (0-100)</label><input type="number" id="risk" min="0" max="100" value="50"></div>
<div><label>Hürmüz Durumu</label><select id="hurmuz"><option value="AÇIK / GÜVENLİ">🟢 AÇIK</option><option value="RİSKLİ">🟡 RİSKLİ</option><option value="KISMEN KAPALI">🟠 KISMEN KAPALI</option><option value="KAPALI">🔴 KAPALI</option></select></div>
</div>
</div>

<div class="card">
<div class="ct">Emtia Override</div>
<div id="comms"></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
<div class="ct" style="margin:0">Özel Veri</div>
<button class="btn-sm" id="addBtn">+ Ekle</button>
</div>
<div id="customs"></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
<div class="ct" style="margin:0">⏱️ Zaman Çizelgesi</div>
<button class="btn-sm" id="addTlBtn">+ Olay Ekle</button>
</div>
<div id="tlEvents"></div>
</div>

<button class="btn" id="saveBtn">💾 KAYDET</button>
<div class="status" id="status"></div>
</div>

<script>
var COMMS=[['BZ=F','BZ (Brent)'],['CL=F','CL (WTI)'],['NG=F','NG (Doğalgaz)'],['MTF=F','TTF'],['HO=F','HO (Isıtma Yağı)'],['RB=F','RB (Benzin)'],['GC=F','XAU (Altın)'],['SI=F','XAG (Gümüş)'],['HG=F','HG (Bakır)'],['ALI=F','ALI (Alüminyum)'],['LBS=F','LBS (Kereste)']];

var ce=document.getElementById('comms');
COMMS.forEach(function(c){
    var id=c[0].replace(/[^a-zA-Z0-9]/g,'_');
    ce.innerHTML+='<div class="row" style="margin-bottom:4px"><div><label>'+c[1]+' Fiyat</label><input type="number" step="any" id="cv_'+id+'"></div><div><label>% Değişim</label><input type="number" step="any" id="cc_'+id+'"></div></div>';
});

function addRow(n,u,v,ch){
    var d=document.createElement('div');d.className='row4';
    d.innerHTML='<div><label>İsim</label><input type="text" class="cn" value="'+(n||'')+'"></div><div><label>Birim</label><input type="text" class="cu" value="'+(u||'')+'"></div><div><label>Değer</label><input type="number" step="any" class="cv" value="'+(v||'')+'"></div><div><label>%</label><input type="number" step="any" class="cc" value="'+(ch||'')+'"></div><button class="btn-del" onclick="this.parentElement.remove()">✕</button>';
    document.getElementById('customs').appendChild(d);
}
document.getElementById('addBtn').onclick=function(){addRow()};

// Timeline olay ekleme
function addTlRow(date,title,desc,tag){
    var d=document.createElement('div');
    d.style.cssText='background:#f8fafc;border:1px solid #dde4ed;border-radius:6px;padding:8px;margin-bottom:6px';
    var today=date||new Date().toISOString().slice(0,10);
    d.innerHTML='<div class="row" style="margin-bottom:4px"><div><label>Tarih</label><input type="date" class="tl-date" value="'+today+'"></div><div><label>Kategori</label><select class="tl-tag" style="width:100%;border:1px solid #dde4ed;border-radius:6px;padding:7px 9px;font-size:.82rem;background:#f8fafc"><option value="mil" '+(tag==='mil'?'selected':'')+'>🔴 Askeri</option><option value="dip" '+(tag==='dip'?'selected':'')+'>🔵 Diplomatik</option><option value="eco" '+(tag==='eco'?'selected':'')+'>🟡 Ekonomik</option><option value="nuk" '+(tag==='nuk'?'selected':'')+'>🟣 Nükleer</option></select></div></div>'+
    '<div style="margin-bottom:4px"><label>Başlık</label><input type="text" class="tl-title" value="'+(title||'')+'" placeholder="Kısa olay başlığı"></div>'+
    '<div style="margin-bottom:4px"><label>Açıklama</label><input type="text" class="tl-desc" value="'+(desc||'')+'" placeholder="1 cümle detay"></div>'+
    '<div style="text-align:right"><button class="btn-del" onclick="this.closest(\'div[style]\').remove()">✕ Sil</button></div>';
    document.getElementById('tlEvents').appendChild(d);
}
document.getElementById('addTlBtn').onclick=function(){addTlRow()};

// Load from API
fetch('/api/iran-state').then(function(r){return r.json()}).then(function(s){
    document.getElementById('risk').value=s.riskScore||50;
    document.getElementById('hurmuz').value=s.hurmuzStatus||'AÇIK / GÜVENLİ';
    if(s.manualCommodities){
        COMMS.forEach(function(c){
            var id=c[0].replace(/[^a-zA-Z0-9]/g,'_');
            if(s.manualCommodities[c[0]]){
                document.getElementById('cv_'+id).value=s.manualCommodities[c[0]].value||'';
                document.getElementById('cc_'+id).value=s.manualCommodities[c[0]].change||'';
            }
        });
    }
    (s.customMetrics||[]).forEach(function(m){addRow(m.name,m.unit,m.value,m.change)});
    (s.timeline||[]).forEach(function(e){addTlRow(e.date,e.title,e.desc,e.tag)});
}).catch(function(){});

// Save to API
document.getElementById('saveBtn').onclick=function(){
    var pin=document.getElementById('pin').value;
    if(!pin){alert('PIN girin!');return}
    var mc={};
    COMMS.forEach(function(c){
        var id=c[0].replace(/[^a-zA-Z0-9]/g,'_');
        var v=parseFloat(document.getElementById('cv_'+id).value);
        var ch=parseFloat(document.getElementById('cc_'+id).value);
        if(!isNaN(v)||!isNaN(ch))mc[c[0]]={value:v||0,change:ch||0};
    });
    var cm=[];
    document.querySelectorAll('.row4').forEach(function(r){
        var n=r.querySelector('.cn').value.trim();if(!n)return;
        cm.push({name:n,unit:r.querySelector('.cu').value.trim(),value:parseFloat(r.querySelector('.cv').value)||0,change:parseFloat(r.querySelector('.cc').value)||0});
    });
    var tl=[];
    document.querySelectorAll('#tlEvents > div').forEach(function(r){
        var title=r.querySelector('.tl-title').value.trim();if(!title)return;
        tl.push({date:r.querySelector('.tl-date').value,title:title,desc:r.querySelector('.tl-desc').value.trim(),tag:r.querySelector('.tl-tag').value});
    });
    var payload={
        pin:pin,
        data:{riskScore:parseInt(document.getElementById('risk').value)||50,hurmuzStatus:document.getElementById('hurmuz').value,manualCommodities:mc,customMetrics:cm,timeline:tl}
    };
    document.getElementById('status').textContent='Kaydediliyor...';
    fetch('/api/iran-state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(r){return r.json()}).then(function(d){
        if(d.success)document.getElementById('status').textContent='✅ Kaydedildi! Tüm cihazlarda güncellenecek.';
        else document.getElementById('status').textContent='❌ Hata: '+(d.error||'Bilinmeyen');
    }).catch(function(e){document.getElementById('status').textContent='❌ Bağlantı hatası: '+e.message});
};
</script>
</body>
</html>
