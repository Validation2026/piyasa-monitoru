<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borsa Endeksleri — Risk Monitörü</title>
    <meta name="description" content="BIST 100, S&P 500, NASDAQ, DAX ve 17 borsa endeksi — anlık veriler, grafikler ve P/E karşılaştırma">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<script src="assets/js/sidebar.js"></script>
<div class="page">
<div class="page-spacer"></div>
    <div class="page-head">
        <h1>📈 Borsa Endeksleri</h1>
        <div class="sub"></div>
        <div class="update-info" id="updateInfo"></div>
    </div>
    <div class="ai-box"><div class="ai-header"><span>🤖 AI Piyasa Analizi</span><span class="ai-badge">AI</span></div><div class="ai-body" id="aiAnalysis"><span class="ai-loading">Analiz yükleniyor...</span></div></div>
    <div class="summary-row" id="summaryCards"></div>
    <div class="chart-timeframes global-timeframes">
        <button class="tf-btn" data-tf="1A">1A</button>
        <button class="tf-btn" data-tf="3A">3A</button>
        <button class="tf-btn" data-tf="6A">6A</button>
        <button class="tf-btn" data-tf="YTD">YTD</button>
        <button class="tf-btn" data-tf="1Y">1Y</button>
        <button class="tf-btn" data-tf="2Y">2Y</button>
        <button class="tf-btn" data-tf="3Y">3Y</button>
        <button class="tf-btn" data-tf="5Y">5Y</button>
        <button class="tf-btn active" data-tf="Tümü">Tümü</button>
    </div>
    <div class="charts" id="chartsGrid"></div>
    <div class="dtable" id="dataTable"></div>

<div class="sec-title">📐 P/E Oranları Karşılaştırma</div>
<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;overflow-x:auto;margin-bottom:18px"><table style="width:100%;border-collapse:collapse;min-width:400px;font-size:.78rem"><thead><tr style="background:var(--bg2)"><th style="padding:8px 12px;text-align:left;font-size:.65rem;color:var(--t3);text-transform:uppercase;border-bottom:1px solid var(--border)">Endeks</th><th style="padding:8px 12px;text-align:right;font-size:.65rem;color:var(--t3);border-bottom:1px solid var(--border)">P/E (TTM)</th><th style="padding:8px 12px;text-align:right;font-size:.65rem;color:var(--t3);border-bottom:1px solid var(--border)">Forward P/E</th><th style="padding:8px 12px;text-align:right;font-size:.65rem;color:var(--t3);border-bottom:1px solid var(--border)">Değerleme</th></tr></thead><tbody>
<tr><td style="padding:7px 12px;border-bottom:1px solid var(--border2)">S&amp;P 500</td><td style="padding:7px 12px;text-align:right;font-family:var(--mono);font-weight:600;border-bottom:1px solid var(--border2)">24.5x</td><td style="padding:7px 12px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border2)">21.0x</td><td style="padding:7px 12px;text-align:right;color:#f59e0b;font-weight:700;border-bottom:1px solid var(--border2)">Ortalamanın Üstü</td></tr>
<tr><td style="padding:7px 12px;border-bottom:1px solid var(--border2)">NASDAQ</td><td style="padding:7px 12px;text-align:right;font-family:var(--mono);font-weight:600;border-bottom:1px solid var(--border2)">32.0x</td><td style="padding:7px 12px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border2)">27.0x</td><td style="padding:7px 12px;text-align:right;color:#ff4757;font-weight:700;border-bottom:1px solid var(--border2)">Pahalı</td></tr>
<tr><td style="padding:7px 12px;border-bottom:1px solid var(--border2)">BIST 100</td><td style="padding:7px 12px;text-align:right;font-family:var(--mono);font-weight:600;border-bottom:1px solid var(--border2)">7.5x</td><td style="padding:7px 12px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border2)">5.8x</td><td style="padding:7px 12px;text-align:right;color:#00d68f;font-weight:700;border-bottom:1px solid var(--border2)">Ucuz</td></tr>
<tr><td style="padding:7px 12px;border-bottom:1px solid var(--border2)">DAX 40</td><td style="padding:7px 12px;text-align:right;font-family:var(--mono);font-weight:600;border-bottom:1px solid var(--border2)">14.0x</td><td style="padding:7px 12px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border2)">12.5x</td><td style="padding:7px 12px;text-align:right;color:#00d68f;font-weight:700;border-bottom:1px solid var(--border2)">Makul</td></tr>
<tr><td style="padding:7px 12px;border-bottom:1px solid var(--border2)">Nikkei 225</td><td style="padding:7px 12px;text-align:right;font-family:var(--mono);font-weight:600;border-bottom:1px solid var(--border2)">18.0x</td><td style="padding:7px 12px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border2)">16.0x</td><td style="padding:7px 12px;text-align:right;color:#3b82f6;font-weight:700;border-bottom:1px solid var(--border2)">Ortalama</td></tr>
<tr><td style="padding:7px 12px">Hang Seng</td><td style="padding:7px 12px;text-align:right;font-family:var(--mono);font-weight:600">9.5x</td><td style="padding:7px 12px;text-align:right;font-family:var(--mono)">8.5x</td><td style="padding:7px 12px;text-align:right;color:#00d68f;font-weight:700">Ucuz</td></tr>
</tbody></table></div>
    <div class="footer">Risk Monitörü © 2026</div>
</div>
<script src="assets/js/app.js"></script>
<script>
(function(){
    var period='5y',allSeries=[],charts=[];
    PM.loadData('indices.json','endeksler').then(function(data){
        if(!data||!data.series||!data.series.length){document.getElementById('summaryCards').innerHTML='<div class="scard"><div class="scard-name">Veri bulunamadı.</div></div>';return}
        allSeries=data.series;
        var ui=document.getElementById('updateInfo');
        if(ui&&data.meta)ui.textContent='Son güncelleme: '+new Date(data.meta.updated_at).toLocaleString('tr-TR')+' \u00b7 '+data.meta.symbol_count+' seri';
        PM.buildSummary('summaryCards',allSeries);
        charts=PM.buildCharts('chartsGrid',allSeries,period);
        PM.buildTable('dataTable',allSeries);
    });
    fetch('/api/ai-analysis?cat=endeksler').then(function(r){return r.json()}).then(function(d){
        var el=document.getElementById('aiAnalysis');if(el&&d.analysis)el.textContent=d.analysis;
    }).catch(function(){var el=document.getElementById('aiAnalysis');if(el)el.innerHTML='<span class="ai-loading">Analiz yüklenemiyor.</span>'});
})();
</script>
</body>
</html>
