<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3b82f6">
    <title>Tahvil Faizleri — Risk Monitörü</title>
    <meta name="description" content="ABD 2, 5, 10 ve 30 yıllık tahvil faizleri — anlık getiri eğrisi ve faiz analizi">
    <meta property="og:title" content="Tahvil Faizleri — Risk Monitörü">
    <meta property="og:description" content="ABD 2, 5, 10 ve 30 yıllık tahvil faizleri — anlık getiri eğrisi ve faiz analizi">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="tr_TR">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%233b82f6'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white'>📊</text></svg>">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        .country-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
        .country-tab{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:.75rem;font-weight:700;cursor:pointer;transition:.2s;color:var(--t2)}
        .country-tab:hover{border-color:var(--blue)}
        .country-tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
    </style>
</head>
<body>
<script src="assets/js/sidebar.js"></script>
<div class="page">
<div class="page-spacer"></div>
    <div class="page-head">
        <h1>📜 Tahvil Faizleri</h1>
        <div class="sub"></div>
        <div class="update-info" id="updateInfo"></div>
    </div>
    <div class="ai-box"><div class="ai-header"><span>🤖 AI Piyasa Analizi</span><span class="ai-badge">AI</span></div><div class="ai-body" id="aiAnalysis"><span class="ai-loading">Analiz yükleniyor...</span></div></div>

    <div class="summary-row" id="summaryCards"></div>
    <div class="periods" id="periodSelector">
        <button class="pbtn" data-period="1m">1A</button>
        <button class="pbtn" data-period="3m">3A</button>
        <button class="pbtn" data-period="6m">6A</button>
        <button class="pbtn" data-period="1y">1Y</button>
        <button class="pbtn" data-period="2y">2Y</button>
        <button class="pbtn" data-period="3y">3Y</button>
        <button class="pbtn" data-period="5y">5Y</button>
        <button class="pbtn" data-period="ytd">YTD</button>
        <button class="pbtn on" data-period="all">Tümü</button>
    </div>
    <div class="charts" id="chartsGrid"></div>
    <div class="dtable" id="dataTable"></div>

<div class="sec-title">🔥 Performans Isı Haritası</div>
<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;overflow-x:auto;margin-bottom:16px">
    <div id="heatmapContainer"></div>
</div>
    <div class="footer">Risk Monitörü © 2026</div>
</div>
<script src="assets/js/app.js"></script>
<script>
(function(){
    var period='all', allSeries=[], chartInstances=[], activeSeries=[];

    function rebuildAll() {
        activeSeries = allSeries;
        if (chartInstances && chartInstances.length) {
            chartInstances.forEach(function(c) { if (c && c.destroy) c.destroy(); });
        }
        chartInstances = [];
        var grid = document.getElementById('chartsGrid');
        if (grid) grid.innerHTML = '';
        PM.buildSummary('summaryCards', activeSeries);
        chartInstances = PM.buildCharts('chartsGrid', activeSeries, period);
        PM.buildTable('dataTable', activeSeries);
    }

    PM.loadData('bonds.json','tahviller').then(function(data){
        if(!data||!data.series||!data.series.length){
            document.getElementById('summaryCards').innerHTML='<div class="scard"><div class="scard-name">Veri bulunamadi.</div></div>';
            return;
        }
        allSeries=data.series;
        var ui=document.getElementById('updateInfo');
        if(ui&&data.meta) ui.textContent='Son guncelleme: '+new Date(data.meta.updated_at).toLocaleString('tr-TR')+' \u00b7 '+data.meta.symbol_count+' seri';
        rebuildAll();
        PM.buildHeatmap('heatmapContainer',allSeries);
    });

    // Period buttons - rebuild charts with new period
    document.getElementById('periodSelector').addEventListener('click',function(e){
        if(!e.target.classList.contains('pbtn')) return;
        document.querySelectorAll('.pbtn').forEach(function(b){b.classList.remove('on')});
        e.target.classList.add('on');
        period = e.target.getAttribute('data-period');
        // Destroy existing chart instances safely
        if (chartInstances && chartInstances.length) {
            chartInstances.forEach(function(c) { if (c && c.destroy) c.destroy(); });
        }
        chartInstances = [];
        // Clear the grid and rebuild
        var grid = document.getElementById('chartsGrid');
        if (grid) grid.innerHTML = '';
        chartInstances = PM.buildCharts('chartsGrid', activeSeries, period);
    });

    fetch('/api/ai-analysis?cat=tahviller').then(function(r){return r.json()}).then(function(d){
        var el=document.getElementById('aiAnalysis');if(el&&d.analysis)el.textContent=d.analysis;
    }).catch(function(){var el=document.getElementById('aiAnalysis');if(el)el.innerHTML='<span class="ai-loading">Analiz yuklenemiyor.</span>'});
})();
</script>
</body>
</html>
