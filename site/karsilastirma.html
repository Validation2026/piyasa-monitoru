<!DOCTYPE html>

<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-bottom:16px;max-height:520px;overflow-y:auto;padding:2px 4px 2px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.comp-grid::-webkit-scrollbar{width:8px}
.comp-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.comp-grid::-webkit-scrollbar-thumb:hover{background:var(--t3)}
.comp-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer;transition:.2s;text-align:center;min-width:0}
.comp-item:hover{border-color:var(--blue)}
.comp-item.on{border-color:var(--blue);background:rgba(59,130,246,.06);box-shadow:0 0 0 2px rgba(59,130,246,.15)}
.comp-item .ci-name{font-size:.7rem;font-weight:700;color:var(--t1);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp-item .ci-val{font-size:.8rem;font-family:var(--mono);font-weight:700;color:var(--t1)}
.comp-item .ci-chg{font-size:.65rem;font-family:var(--mono);font-weight:700}
.comp-item .ci-chg.u{color:var(--green)}.comp-item .ci-chg.d{color:var(--red)}
.chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.chart-wrap h3{font-size:.88rem;font-weight:700;margin-bottom:10px}
.chart-wrap canvas{max-height:400px}
.heat-grid{display:grid;gap:2px;margin-bottom:16px}
.heat-cell{padding:6px 4px;text-align:center;font-size:.6rem;font-family:var(--mono);font-weight:700;border-radius:4px;line-height:1.2}
.heat-header{font-size:.58rem;font-weight:800;color:var(--t2);padding:4px;text-align:center}
.perf-table{width:100%;border-collapse:collapse;font-size:.75rem}
.perf-table th{background:var(--card);padding:8px 6px;text-align:right;font-weight:700;color:var(--t2);font-size:.65rem;text-transform:uppercase;border-bottom:2px solid var(--border)}
.perf-table th:first-child{text-align:left}
.perf-table td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:right;font-family:var(--mono)}
.perf-table td:first-child{text-align:left;font-weight:600;font-family:var(--font)}
.perf-table td.u{color:var(--green)}.perf-table td.d{color:var(--red)}
.sec-title{font-size:.88rem;font-weight:700;margin:18px 0 10px;color:var(--t1)}
.category-tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.cat-tab{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:.68rem;font-weight:700;cursor:pointer;color:var(--t2);transition:.2s;white-space:nowrap}
.cat-tab:hover{border-color:var(--blue)}.cat-tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.cat-tab .cat-count{display:inline-block;margin-left:4px;padding:1px 5px;border-radius:99px;background:var(--bg2);color:var(--t3);font-size:.58rem;font-weight:700}
.cat-tab.on .cat-count{background:rgba(255,255,255,.25);color:#fff}
.comp-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.comp-search{flex:1;min-width:200px;position:relative}
.comp-search input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--t1);font-size:.78rem;outline:none;font-family:inherit}
.comp-search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.comp-search::before{content:'🔍';position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:.82rem;opacity:.6}
.comp-meta{display:flex;gap:14px;font-size:.68rem;color:var(--t3);font-family:var(--mono);white-space:nowrap}
.comp-meta b{color:var(--blue);font-weight:700}
.comp-empty{grid-column:1/-1;padding:28px 12px;text-align:center;color:var(--t3);font-size:.8rem}
@media(max-width:768px){
    .comp-grid{grid-template-columns:repeat(2,1fr);gap:4px;max-height:420px}
    .chart-wrap canvas{max-height:280px}
    .heat-cell{padding:4px 2px;font-size:.5rem}
    .heat-header{font-size:.48rem}
    .perf-table{font-size:.65rem}
    .perf-table th,.perf-table td{padding:5px 3px}
    .category-tabs{gap:3px}
    .cat-tab{padding:4px 8px;font-size:.62rem}
    .comp-toolbar{gap:6px}
    .comp-search input{font-size:.72rem;padding:6px 8px 6px 26px}
}
@media(max-width:480px){
    .comp-grid{grid-template-columns:repeat(2,1fr);max-height:380px}
    .comp-item .ci-name{font-size:.6rem}
    .comp-item .ci-val{font-size:.7rem}
    .comp-meta{font-size:.62rem;gap:10px}
}
</style>
</head>
<body>
<script src="assets/js/sidebar.js"></script>
<div class="page">
<div class="page-spacer"></div>
<div class="page-head">
    <h1>📊 Varlık Karşılaştırma & Korelasyon</h1>
    <div class="sub">Farklı varlık sınıflarını karşılaştırın, korelasyonları analiz edin</div>
    <div style="margin-top:10px"><button type="button" class="tbl-csv-btn" id="karsExcel" title="Seçili varlıkların özet ve tarihsel verilerini Excel'e indir">⬇ Excel</button></div>
</div>

<div class="sec-title">Kategori Seç</div>
<div class="category-tabs" id="catTabs">
    <button class="cat-tab on" data-cat="popular">⭐ Popüler<span class="cat-count" data-cnt="popular"></span></button>
    <button class="cat-tab" data-cat="all">📋 Tümü<span class="cat-count" data-cnt="all"></span></button>
    <button class="cat-tab" data-cat="energy">⛽ Enerji<span class="cat-count" data-cnt="energy"></span></button>
    <button class="cat-tab" data-cat="metals">🥇 Madenler<span class="cat-count" data-cnt="metals"></span></button>
    <button class="cat-tab" data-cat="agriculture">🌾 Tarım<span class="cat-count" data-cnt="agriculture"></span></button>
    <button class="cat-tab" data-cat="industrial">🏭 Sanayi<span class="cat-count" data-cnt="industrial"></span></button>
    <button class="cat-tab" data-cat="currencies">💱 Döviz<span class="cat-count" data-cnt="currencies"></span></button>
    <button class="cat-tab" data-cat="indices">📈 Endeksler<span class="cat-count" data-cnt="indices"></span></button>
    <button class="cat-tab" data-cat="crypto">₿ Kripto<span class="cat-count" data-cnt="crypto"></span></button>
    <button class="cat-tab" data-cat="bonds">📜 Tahvil<span class="cat-count" data-cnt="bonds"></span></button>
    <button class="cat-tab" data-cat="stocks">💹 Hisseler<span class="cat-count" data-cnt="stocks"></span></button>
</div>

<div class="sec-title">Karşılaştırmak istediğiniz varlıkları seçin (en fazla 6)</div>
<div class="comp-toolbar">
    <div class="comp-search"><input type="text" id="compSearch" placeholder="Ara: Brent, BTC, USD/TRY…" autocomplete="off" aria-label="Varlık ara"></div>
    <div class="comp-meta"><span>Seçili: <b id="selCount">0</b>/6</span><span>Gösterilen: <b id="shownCount">0</b></span></div>
</div>
<div class="comp-grid" id="compGrid"></div>

<div class="periods" id="periodSelector">
    <button class="pbtn" data-period="1m">1A</button>
    <button class="pbtn" data-period="3m">3A</button>
    <button class="pbtn" data-period="6m">6A</button>
    <button class="pbtn on" data-period="1y">1Y</button>
    <button class="pbtn" data-period="2y">2Y</button>
    <button class="pbtn" data-period="5y">5Y</button>
    <button class="pbtn" data-period="ytd">YTD</button>
    <button class="pbtn" data-period="all">Tümü</button>
</div>

<div class="chart-wrap">
    <h3>📈 Normalize Performans (%)</h3>
    <canvas id="compChart"></canvas>
</div>

<div class="sec-title">🔥 Korelasyon Matrisi</div>
<div id="heatMap" style="overflow-x:auto;margin-bottom:16px"></div>

<div class="sec-title">📋 Performans Tablosu</div>
<div class="dtable" id="perfTable"></div>

<div class="footer">Risk Monitoru © 2026</div>
</div>

<script src="assets/js/app.js"></script>
<script>
(function(){

// Her kategori → kaynak JSON dosyaları
var FILES_BY_CAT = {
    energy:       ['commodities_energy.json'],
    metals:       ['commodities_metals.json'],
    agriculture:  ['commodities_agriculture.json'],
    industrial:   ['industrial.json'],
    currencies:   ['currencies.json'],
    indices:      ['indices.json'],
    crypto:       ['crypto.json'],
    bonds:        ['bonds.json'],
    stocks:       ['stocks.json']
};
var ALL_FILES = ['commodities_energy.json','commodities_metals.json','commodities_agriculture.json',
                 'industrial.json','currencies.json','indices.json','crypto.json','bonds.json','stocks.json'];

var POPULAR_IDS = ['BZ=F','CL=F','GC=F','SI=F','^GSPC','^IXIC','^GDAXI','^N225',
                   'XU100.IS','BTC-USD','ETH-USD','USDTRY=X','EURUSD=X','GBPUSD=X',
                   'USDJPY=X','EURTRY=X','DX-Y.NYB','^TNX','HG=F','NG=F'];

var allData = {};       // id -> series
var fileOfId = {};      // id -> source file
var selected = [];
var period = '1y';
var compChart = null;
var currentCat = 'popular';
var currentFilter = '';

function idsForCat(cat){
    if(cat === 'popular'){
        return POPULAR_IDS.filter(function(id){ return allData[id]; });
    }
    if(cat === 'all'){
        return Object.keys(allData);
    }
    var files = FILES_BY_CAT[cat] || [];
    return Object.keys(fileOfId).filter(function(id){ return files.indexOf(fileOfId[id]) > -1; });
}

function seriesForCat(cat){
    return idsForCat(cat).map(function(id){ return allData[id]; }).filter(Boolean);
}

function updateCategoryCounts(){
    ['popular','all','energy','metals','agriculture','industrial','currencies','indices','crypto','bonds','stocks'].forEach(function(cat){
        var el = document.querySelector('.cat-count[data-cnt="'+cat+'"]');
        if(el) el.textContent = idsForCat(cat).length;
    });
}

function matchesFilter(s, q){
    if(!q) return true;
    q = q.toLowerCase();
    return (s.name || '').toLowerCase().indexOf(q) > -1
        || (s.id   || '').toLowerCase().indexOf(q) > -1;
}

function renderGrid(){
    var grid = document.getElementById('compGrid');
    if(!grid) return;
    var items = seriesForCat(currentCat).filter(function(s){ return matchesFilter(s, currentFilter); });
    // Ad'a göre alfabetik (popüler korunsun)
    if(currentCat !== 'popular'){
        items.sort(function(a,b){ return (a.name||'').localeCompare(b.name||'','tr'); });
    }
    grid.innerHTML = '';
    if(!items.length){
        grid.innerHTML = '<div class="comp-empty">Eşleşen varlık yok.</div>';
        document.getElementById('shownCount').textContent = '0';
        return;
    }
    var frag = document.createDocumentFragment();
    items.forEach(function(s){
        var isOn = selected.indexOf(s.id) > -1;
        var chgCls = s.change_1d_pct != null ? (s.change_1d_pct >= 0 ? 'u' : 'd') : '';
        var chgTxt = s.change_1d_pct != null ? ((s.change_1d_pct >= 0 ? '+' : '') + s.change_1d_pct.toFixed(2) + '%') : '—';
        var div = document.createElement('div');
        div.className = 'comp-item' + (isOn ? ' on' : '');
        div.setAttribute('data-id', s.id);
        div.setAttribute('title', s.name);
        div.innerHTML = '<div class="ci-name">' + s.name + '</div>' +
                        '<div class="ci-val">' + PM.fp(s.current) + '</div>' +
                        '<div class="ci-chg ' + chgCls + '">' + chgTxt + '</div>';
        div.addEventListener('click', function(){ toggleSelect(s.id); });
        frag.appendChild(div);
    });
    grid.appendChild(frag);
    document.getElementById('shownCount').textContent = String(items.length);
}

function toggleSelect(id){
    var idx = selected.indexOf(id);
    if(idx > -1){
        selected.splice(idx, 1);
    } else {
        if(selected.length >= 6) selected.shift();
        selected.push(id);
    }
    document.querySelectorAll('.comp-item').forEach(function(el){
        el.classList.toggle('on', selected.indexOf(el.getAttribute('data-id')) > -1);
    });
    document.getElementById('selCount').textContent = String(selected.length);
    updateCharts();
}

function updateCharts() {
    var seriesList = selected.map(function(id) { return allData[id]; }).filter(Boolean);

    // Comparison chart
    if (compChart) { compChart.destroy(); compChart = null; }
    if (seriesList.length > 0) {
        compChart = PM.buildComparisonChart('compChart', seriesList, period);
    }

    // Correlation matrix
    buildCorrelation(seriesList);

    // Performance table
    buildPerfTable(seriesList);
}

function buildCorrelation(seriesList) {
    var el = document.getElementById('heatMap');
    if (seriesList.length < 2) { el.innerHTML = '<div style="color:var(--t3);font-size:.8rem;padding:10px">En az 2 varlık seçin.</div>'; return; }

    var n = seriesList.length;
    var cols = n + 1;
    el.style.display = 'grid';

    // Get overlapping data for correlation
    var filtered = seriesList.map(function(s) {
        return PM.filterPeriod(s.data, period);
    });

    // Build date-aligned values
    var dateMap = {};
    filtered.forEach(function(fdata, i) {
        fdata.forEach(function(d) {
            if (!dateMap[d.date]) dateMap[d.date] = new Array(n).fill(null);
            dateMap[d.date][i] = d.value;
        });
    });

    var dates = Object.keys(dateMap).sort();
    var aligned = [];
    dates.forEach(function(dt) {
        var row = dateMap[dt];
        var allValid = true;
        for (var i = 0; i < n; i++) { if (row[i] == null) allValid = false; }
        if (allValid) aligned.push(row);
    });

    // Calculate returns
    var returns = [];
    for (var i = 1; i < aligned.length; i++) {
        var ret = [];
        for (var j = 0; j < n; j++) {
            ret.push(aligned[i][j] / aligned[i-1][j] - 1);
        }
        returns.push(ret);
    }

    // Correlation matrix
    function corr(a, b) {
        if (returns.length < 5) return 0;
        var ma = 0, mb = 0;
        returns.forEach(function(r) { ma += r[a]; mb += r[b]; });
        ma /= returns.length; mb /= returns.length;
        var num = 0, da = 0, db = 0;
        returns.forEach(function(r) {
            var x = r[a] - ma, y = r[b] - mb;
            num += x * y; da += x * x; db += y * y;
        });
        var denom = Math.sqrt(da * db);
        return denom > 0 ? num / denom : 0;
    }

    var html = '<div style="display:grid;grid-template-columns:60px repeat(' + n + ',1fr);gap:2px">';
    html += '<div class="heat-header"></div>';
    seriesList.forEach(function(s) {
        var short = s.name.length > 8 ? s.name.substring(0, 8) : s.name;
        html += '<div class="heat-header">' + short + '</div>';
    });

    for (var i = 0; i < n; i++) {
        var short = seriesList[i].name.length > 8 ? seriesList[i].name.substring(0, 8) : seriesList[i].name;
        html += '<div class="heat-header" style="text-align:right;padding-right:6px">' + short + '</div>';
        for (var j = 0; j < n; j++) {
            var c = i === j ? 1 : corr(i, j);
            var bg = corrColor(c);
            html += '<div class="heat-cell" style="background:' + bg + ';color:' + (Math.abs(c) > 0.5 ? '#fff' : 'var(--t1)') + '">' + c.toFixed(2) + '</div>';
        }
    }
    html += '</div>';
    el.innerHTML = html;
}

function corrColor(v) {
    if (v >= 0.7) return '#16a34a';
    if (v >= 0.4) return '#4ade80';
    if (v >= 0.1) return '#bbf7d0';
    if (v > -0.1) return '#f1f5f9';
    if (v > -0.4) return '#fecaca';
    if (v > -0.7) return '#f87171';
    return '#dc2626';
}

function buildPerfTable(seriesList) {
    var el = document.getElementById('perfTable');
    if (!seriesList.length) { el.innerHTML = ''; return; }
    var html = '<table class="perf-table"><thead><tr><th>Varlık</th><th>Fiyat</th><th>1G</th><th>1H</th><th>1A</th><th>YTD</th><th>1Y</th><th>52H Aralık</th></tr></thead><tbody>';
    seriesList.forEach(function(s) {
        function cv(p) { if (p == null) return '<td class="d" style="color:var(--t3)">—</td>'; return '<td class="' + (p >= 0 ? 'u' : 'd') + '">' + (p >= 0 ? '+' : '') + p.toFixed(2) + '%</td>'; }
        html += '<tr><td>' + s.name + '</td><td style="font-family:var(--mono)">' + PM.fp(s.current) + ' ' + (s.unit || '') + '</td>' + cv(s.change_1d_pct) + cv(s.change_1w_pct) + cv(s.change_1m_pct) + cv(s.change_ytd_pct) + cv(s.change_1y_pct) + '<td style="font-family:var(--mono);font-size:.7rem;color:var(--t3)">' + (s.low_52w != null ? PM.fp(s.low_52w) + ' — ' + PM.fp(s.high_52w) : '—') + '</td></tr>';
    });
    html += '</tbody></table>';
    el.innerHTML = html;
}

// Başlat
Promise.all(ALL_FILES.map(function(f){
    return PM.fj(f).then(function(d){
        if(d && d.series){
            d.series.forEach(function(s){
                allData[s.id] = s;
                fileOfId[s.id] = f;
            });
        }
    });
})).then(function(){
    selected = ['BZ=F','GC=F','^GSPC','BTC-USD'].filter(function(id){ return allData[id]; });
    document.getElementById('selCount').textContent = String(selected.length);
    updateCategoryCounts();
    renderGrid();
    updateCharts();
});

// Kategori tab'ları
document.getElementById('catTabs').addEventListener('click', function(e){
    var btn = e.target.closest('.cat-tab');
    if(!btn) return;
    document.querySelectorAll('.cat-tab').forEach(function(b){ b.classList.remove('on'); });
    btn.classList.add('on');
    currentCat = btn.getAttribute('data-cat');
    renderGrid();
});

// Arama
var searchInput = document.getElementById('compSearch');
var searchTimer = null;
if(searchInput){
    searchInput.addEventListener('input', function(){
        if(searchTimer) clearTimeout(searchTimer);
        searchTimer = setTimeout(function(){
            currentFilter = searchInput.value.trim();
            renderGrid();
        }, 120);
    });
}

// Period selector
document.getElementById('periodSelector').addEventListener('click', function(e) {
    if (!e.target.classList.contains('pbtn')) return;
    document.querySelectorAll('.pbtn').forEach(function(b) { b.classList.remove('on'); });
    e.target.classList.add('on');
    period = e.target.getAttribute('data-period');
    updateCharts();
});

// Excel indirme
var karsBtn = document.getElementById('karsExcel');
if(karsBtn){
    karsBtn.addEventListener('click', function(){
        var seriesList = selected.map(function(id){return allData[id]}).filter(Boolean);
        if(!seriesList.length){alert('Önce karşılaştırılacak varlık seçin');return;}
        PM.exportTableExcel(seriesList, 'karsilastirma-'+new Date().toISOString().slice(0,10));
    });
}

})();
</script>
</body>
</html>
