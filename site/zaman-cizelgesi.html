<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savaş Zaman Çizelgesi — Piyasa Monitörü</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔴</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.tl-counter{background:linear-gradient(135deg,#1a0000,#330000);border:2px solid #660000;border-radius:12px;padding:16px;text-align:center;margin-bottom:18px}
.tl-day{font-size:2.5rem;font-weight:900;font-family:'JetBrains Mono',monospace;color:#ff4757}
.tl-label{font-size:.65rem;color:#ff6b6b;text-transform:uppercase;letter-spacing:2px}

.timeline{position:relative;margin-bottom:22px;padding-left:28px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:#dde4ed}
.tl-item{position:relative;margin-bottom:18px}
.tl-dot{position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid #fff;z-index:1}
.tl-dot.red{background:#ff4757}.tl-dot.orange{background:#f97316}.tl-dot.blue{background:#3b82f6}.tl-dot.green{background:#00d68f}.tl-dot.purple{background:#a78bfa}
.tl-date{font-size:.68rem;font-family:'JetBrains Mono',monospace;font-weight:700;color:#94a3b8;margin-bottom:2px}
.tl-title{font-size:.85rem;font-weight:700;color:#0f172a;margin-bottom:2px}
.tl-desc{font-size:.75rem;color:#64748b;line-height:1.5}
.tl-tag{display:inline-block;font-size:.58rem;font-weight:700;padding:2px 6px;border-radius:3px;margin-top:4px;text-transform:uppercase}
.tag-mil{background:#fee2e2;color:#dc2626}.tag-dip{background:#dbeafe;color:#2563eb}.tag-eco{background:#fef3c7;color:#d97706}.tag-nuk{background:#f3e8ff;color:#7c3aed}

.tl-filter{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tl-fbtn{background:#fff;border:1px solid #dde4ed;border-radius:6px;padding:5px 12px;font-size:.7rem;font-weight:600;cursor:pointer;transition:.2s;color:#64748b}
.tl-fbtn:hover,.tl-fbtn.on{background:#3b82f6;color:#fff;border-color:#3b82f6}

@media(max-width:600px){.tl-day{font-size:1.8rem}.tl-title{font-size:.8rem}}
</style>
</head>
<body>
<script src="assets/js/sidebar.js"></script>
<div class="page">
<div class="page-head"><h1>⏱️ Savaş Zaman Çizelgesi</h1></div>

<div class="tl-counter">
<div class="tl-label">İran-İsrail Savaşı</div>
<div class="tl-day" id="dayCount">—</div>
<div class="tl-label">GÜN</div>
<div style="font-size:.58rem;color:#993333;margin-top:4px">28 Şubat 2026'dan bu yana</div>
</div>

<div class="tl-filter">
<button class="tl-fbtn on" data-f="all">Tümü</button>
<button class="tl-fbtn" data-f="mil">🔴 Askeri</button>
<button class="tl-fbtn" data-f="dip">🔵 Diplomatik</button>
<button class="tl-fbtn" data-f="eco">🟡 Ekonomik</button>
<button class="tl-fbtn" data-f="nuk">🟣 Nükleer</button>
</div>

<div class="timeline" id="timeline"></div>

<div class="footer">Piyasa Monitörü © 2026</div>
</div>
<script>
(function(){
document.getElementById('dayCount').textContent=Math.max(0,Math.floor((new Date()-new Date('2026-02-28T00:00:00+03:00'))/864e5));

var events=[
{d:'2026-02-28',t:'İran-İsrail arasında doğrudan çatışma başladı',desc:'İsrail, İran nükleer tesislerine kapsamlı hava operasyonu düzenledi. İran karşılık olarak balistik füzelerle Tel Aviv ve askeri hedefleri vurdu.',tag:'mil',dot:'red'},
{d:'2026-02-28',t:'BMGK acil toplantı çağrısı',desc:'BM Güvenlik Konseyi acil oturum için toplandı. ABD ve Rusya veto kullandı.',tag:'dip',dot:'blue'},
{d:'2026-03-01',t:'Brent petrol %12 sıçradı',desc:'Hürmüz Boğazı riski ile Brent 95$\'tan 106$\'a fırladı. Altın 4500$ üzerine çıktı.',tag:'eco',dot:'orange'},
{d:'2026-03-02',t:'İran Natanz tesisi vuruldu',desc:'İsrail F-35\'leri Natanz uranyum zenginleştirme tesisini hedef aldı. IAEA acil açıklama yaptı.',tag:'nuk',dot:'purple'},
{d:'2026-03-03',t:'Hürmüz Boğazı\'nda tanker trafiği aksadı',desc:'İran donanması boğaz çevresinde tatbikat başlattı. Sigorta primleri 10 katına çıktı.',tag:'eco',dot:'orange'},
{d:'2026-03-05',t:'ABD 5. Filo tam konuşlanma',desc:'ABD iki uçak gemisi grubuyla Basra Körfezi\'ne konuşlandı. B-2 bombardıman uçakları Diego Garcia\'ya transfer edildi.',tag:'mil',dot:'red'},
{d:'2026-03-07',t:'Hizbullah kuzey İsrail\'i vurdu',desc:'Lübnan\'dan 200+ roket atıldı. İsrail Beyrut güney banliyölerini bombaladı.',tag:'mil',dot:'red'},
{d:'2026-03-08',t:'İran Isfahan\'a saldırı',desc:'İsrail Isfahan nükleer tesislerini ikinci kez vurdu. İran "orantısız yanıt" sözü verdi.',tag:'nuk',dot:'purple'},
{d:'2026-03-10',t:'Çin ve Hindistan arabuluculuk teklifi',desc:'Çin Dışişleri Bakanı bölge turuna çıktı. Hindistan her iki tarafla da görüştü.',tag:'dip',dot:'blue'},
{d:'2026-03-12',t:'Husiler Kızıldeniz\'de tanker vurdu',desc:'Yemen Husileri Bab el-Mandeb\'de Yunan bayraklı tankeri hedef aldı. Navlun ücretleri %40 arttı.',tag:'mil',dot:'red'},
{d:'2026-03-14',t:'OPEC+ acil toplantı',desc:'Suudi Arabistan liderliğinde OPEC+ acil toplantı yaptı. Günlük 500K varil ek üretim kararı.',tag:'eco',dot:'orange'},
{d:'2026-03-16',t:'İran Buşehr reaktörü kapatıldı',desc:'Güvenlik gerekçesiyle Buşehr nükleer santralı geçici olarak devre dışı bırakıldı.',tag:'nuk',dot:'purple'},
{d:'2026-03-18',t:'İsrail kara harekatı sinyali',desc:'İsrail Lübnan sınırında yığınak yaptı. 50.000 yedek asker silah altına alındı.',tag:'mil',dot:'red'},
{d:'2026-03-20',t:'Nevruz ateşkes teklifi',desc:'İran Nevruz vesilesiyle 72 saatlik ateşkes önerdi. İsrail reddetti.',tag:'dip',dot:'blue'},
{d:'2026-03-22',t:'Süveyş trafiği %30 düştü',desc:'Sigorta maliyetleri ve güvenlik riskleri nedeniyle gemiler Ümit Burnu rotasına yöneldi.',tag:'eco',dot:'orange'},
{d:'2026-03-25',t:'ABD İran\'a yeni yaptırımlar',desc:'ABD, İran petrol ihracatına tam ambargo uyguladı. İran\'ın günlük 500K varil ihracatı durduruldu.',tag:'eco',dot:'orange'},
{d:'2026-03-28',t:'İran Demir Kubbe\'yi aştı',desc:'İran hipersonik füzesi İsrail Demir Kubbe savunmasını ilk kez deldi. Tel Aviv yakınlarına isabet.',tag:'mil',dot:'red'},
{d:'2026-03-30',t:'G7 ortak bildirisi',desc:'G7 liderleri ateşkes çağrısında bulundu. İnsani yardım koridoru talebi.',tag:'dip',dot:'blue'},
{d:'2026-04-01',t:'İran çelik tesisleri vuruldu',desc:'İsrail İran\'ın çelik üretim kapasitesinin %70\'ini hedef aldı. Silah üretim zinciri hedef alındı.',tag:'mil',dot:'red'},
{d:'2026-04-02',t:'İran köprü saldırısı',desc:'Stratejik altyapı hedef alındı. İran "kırmızı çizgi aşıldı" açıklaması yaptı.',tag:'mil',dot:'red'},
{d:'2026-04-03',t:'Trump: Henüz başlamadık bile',desc:'ABD Başkanı Trump İran\'a yönelik operasyonların genişleyeceği mesajı verdi. Hürmüz Boğazı gerilimi tırmandı.',tag:'dip',dot:'blue'},
];

function render(filter){
    var el=document.getElementById('timeline');
    var filtered=filter==='all'?events:events.filter(function(e){return e.tag===filter});
    el.innerHTML=filtered.reverse().map(function(e){
        var tagLabel={mil:'Askeri',dip:'Diplomatik',eco:'Ekonomik',nuk:'Nükleer'}[e.tag];
        return '<div class="tl-item" data-tag="'+e.tag+'"><div class="tl-dot '+e.dot+'"></div><div class="tl-date">'+e.d+'</div><div class="tl-title">'+e.t+'</div><div class="tl-desc">'+e.desc+'</div><span class="tl-tag tag-'+e.tag+'">'+tagLabel+'</span></div>';
    }).join('');
    filtered.reverse(); // restore order
}
render('all');

document.querySelector('.tl-filter').addEventListener('click',function(ev){
    if(!ev.target.classList.contains('tl-fbtn'))return;
    document.querySelectorAll('.tl-fbtn').forEach(function(b){b.classList.remove('on')});
    ev.target.classList.add('on');
    render(ev.target.getAttribute('data-f'));
});
})();
</script>
</body>
</html>
