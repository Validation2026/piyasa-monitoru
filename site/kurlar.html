<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Döviz Kurları — Piyasa Monitörü</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

<nav class="nav">
    <a class="nav-brand" href="index.html">📊 Piyasa Monitörü</a>
    <div class="nav-links">
        <a href="index.html">Panel</a>
        <a href="emtia-enerji.html" >Enerji</a>
        <a href="emtia-metaller.html" >Madenler</a>
        <a href="emtia-tarim.html" >Tarım</a>
        <a href="kurlar.html" class="active">Döviz</a>
        <a href="tahviller.html" >Tahvil</a>
        <a href="endeksler.html" >Endeksler</a>
        <a href="makro.html" >Makro</a>
    </div>
    <div class="nav-spacer"></div>
    <span class="nav-clock" id="clock"></span>
    <button class="theme-btn" id="themeToggle">🌙</button>
</nav>

<div class="page">
    <div class="page-head">
        <div class="breadcrumb"><a href="index.html">Ana Sayfa</a> › Döviz Kurları</div>
        <h1>💱 Döviz Kurları</h1>
        <div class="sub">USD/TRY, EUR/TRY, çapraz kurlar, Dolar Endeksi (DXY)</div>
        <div class="update-info" id="updateInfo">Yükleniyor...</div>
    </div>

    <div class="summary-row" id="summaryCards"></div>

    <div class="periods" id="periodSelector">
        <button class="pbtn" data-period="1m">1A</button>
        <button class="pbtn" data-period="3m">3A</button>
        <button class="pbtn" data-period="6m">6A</button>
        <button class="pbtn on" data-period="1y">1Y</button>
        <button class="pbtn" data-period="ytd">YTD</button>
    </div>

    <div class="charts" id="chartsGrid"></div>
    <div class="dtable" id="dataTable"></div>

    <div class="footer">
        <span>Piyasa Monitörü © 2026</span>
        <a href="index.html">Ana Sayfa</a>
        <span style="color:var(--t3)">Kaynak: Yahoo Finance</span>
    </div>
</div>

<script src="assets/js/app.js"></script>
<script>
(function(){
    'use strict';
    var FILE='currencies.json';
    var period='1y';
    var allSeries=[];
    var charts=[];

    PM.fj(FILE).then(function(data){
        if(!data||!data.series||!data.series.length){
            document.getElementById('summaryCards').innerHTML='<div class="scard"><div class="scard-name">Veri bulunamadı. Collector çalıştırın.</div></div>';
            return;
        }
        allSeries=data.series;

        // Update info
        var ui=document.getElementById('updateInfo');
        if(ui&&data.meta)ui.textContent='Son güncelleme: '+new Date(data.meta.updated_at).toLocaleString('tr-TR')+' · '+data.meta.symbol_count+' seri';

        PM.buildSummary('summaryCards',allSeries);
        charts=PM.buildCharts('chartsGrid',allSeries,period);
        PM.buildTable('dataTable',allSeries);
    });

    document.getElementById('periodSelector').addEventListener('click',function(e){
        if(!e.target.classList.contains('pbtn'))return;
        document.querySelectorAll('.pbtn').forEach(function(b){b.classList.remove('on')});
        e.target.classList.add('on');
        period=e.target.getAttribute('data-period');
        if(charts)charts.forEach(function(c){c.destroy()});
        charts=PM.buildCharts('chartsGrid',allSeries,period);
    });
})();
</script>
</body>
</html>
