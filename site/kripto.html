<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3b82f6">
    <title>Kripto Paralar — Risk Monitörü</title>
    <meta name="description" content="Bitcoin, Ethereum, Solana ve majör kripto paralar — anlık fiyatlar, grafikler ve Bitcoin ETF durumu">
    <meta property="og:title" content="Kripto Paralar — Risk Monitörü">
    <meta property="og:description" content="Bitcoin, Ethereum, Solana ve majör kripto paralar — anlık fiyatlar, grafikler ve Bitcoin ETF durumu">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="tr_TR">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%233b82f6'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white'>📊</text></svg>">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<script src="assets/js/active-assets.js"></script>
<script src="assets/js/sidebar.js"></script>
<div class="page">
<div class="page-spacer"></div>
    <div class="page-head">
        <h1>₿ Kripto Paralar</h1>
        <div class="sub"></div>
        <div class="update-info" id="updateInfo"></div>
    </div>
    <div class="ai-box ai-compact"><div class="ai-header"><span>🤖 AI Piyasa Analizi</span><span class="ai-badge">AI</span></div><div class="ai-body" id="aiAnalysis"><span class="ai-loading">Analiz yükleniyor...</span></div></div>
    <div class="view-toggle" id="viewToggle">
        <button class="view-btn on" data-view="cards">📋 Kartlar</button>
        <button class="view-btn" data-view="bar">📊 Performans</button>
        <button class="view-btn" data-view="heatmap">🔥 Isı Haritası</button>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px 0;flex-wrap:wrap">
        <div id="cryptoFilterInfo" style="color:var(--muted);font-size:12px">Majör kripto paralar gösteriliyor.</div>
        <button class="tf-btn" id="toggleAllCryptoBtn" type="button" aria-pressed="false">Tüm kriptoları göster</button>
    </div>

    <div class="view-section active" id="viewCards">
        <div class="summary-row" id="summaryCards"></div>
        <div class="pager" id="cardsPager"></div>
        <div style="margin:0 0 12px 0"><button class="tf-btn" id="toggleChartsBtn" type="button" aria-expanded="false">📉 Grafikleri Aç</button></div>
        <div class="chart-timeframes global-timeframes" style="display:none">
            <button class="tf-btn" data-tf="1A">1A</button>
            <button class="tf-btn" data-tf="3A">3A</button>
            <button class="tf-btn" data-tf="6A">6A</button>
            <button class="tf-btn" data-tf="YTD">YTD</button>
            <button class="tf-btn" data-tf="1Y">1Y</button>
            <button class="tf-btn" data-tf="2Y">2Y</button>
            <button class="tf-btn" data-tf="3Y">3Y</button>
            <button class="tf-btn" data-tf="5Y">5Y</button>
            <button class="tf-btn active" data-tf="Tümü">Tümü</button>
        </div>
        <div class="charts" id="chartsGrid" style="display:none"></div>
        <div class="dtable" id="dataTable"></div>
    </div>

    <div class="view-section" id="viewBar">
        <div class="bar-chart-card">
            <div class="chart-title">📊 Günlük Performans Sıralaması</div>
            <div class="chart-subtitle" id="dailyBarSubtitle">Görünen kripto paralar — günlük % değişim</div>
            <canvas id="perfBarDaily"></canvas>
        </div>
        <div class="bar-chart-card">
            <div class="chart-title">📊 Aylık Performans Sıralaması</div>
            <div class="chart-subtitle" id="monthlyBarSubtitle">Görünen kripto paralar — 1 aylık % değişim</div>
            <canvas id="perfBarMonthly"></canvas>
        </div>
    </div>

    <div class="view-section" id="viewHeatmap">
        <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;overflow-x:auto;margin-bottom:16px">
            <div id="heatmapContainer"></div>
        </div>
    </div>

    <div class="footer">Risk Monitörü © 2026</div>
</div>
<script src="assets/js/app.js"></script>
<script>
(function(){
    var currentView='cards',sourceSeries=[],allSeries=[],chartInstances=[],barCharts=[];
    var page=1;
    var PAGE_SIZE=24;
    var chartsExpanded=false;
    var showAllCrypto=false;
    var VISIBLE_CRYPTO_IDS=['BTC-USD','ETH-USD','BNB-USD','SOL-USD','XRP-USD','ADA-USD','DOGE-USD','AVAX-USD','TRX-USD','LINK-USD','DOT-USD','BCH-USD','LTC-USD','TON11419-USD','SUI20947-USD','XLM-USD','HBAR-USD'];
    var VISIBLE_CRYPTO_ID_SET=VISIBLE_CRYPTO_IDS.reduce(function(acc,id){acc[id]=true;return acc;},{});

    function destroyCharts(){
        if(chartInstances.length){chartInstances.forEach(function(c){if(c&&c.destroy)c.destroy()});}
        chartInstances=[];
        var g=document.getElementById('chartsGrid');if(g)g.innerHTML='';
    }

    function paged(list){
        var total=Math.max(1,Math.ceil(list.length/PAGE_SIZE));
        if(page>total)page=total;
        var start=(page-1)*PAGE_SIZE;
        return list.slice(start,start+PAGE_SIZE);
    }


    function setMetaDescription(text){
        var desc=document.querySelector('meta[name="description"]');
        var ogDesc=document.querySelector('meta[property="og:description"]');
        if(desc)desc.setAttribute('content',text);
        if(ogDesc)ogDesc.setAttribute('content',text);
    }

    function refreshCryptoFilter(){
        allSeries=showAllCrypto ? sourceSeries.slice() : sourceSeries.filter(function(item){return VISIBLE_CRYPTO_ID_SET[item.id];});
        page=1;
        var visibleCount=allSeries.length;
        var totalCount=sourceSeries.length;
        var hiddenCount=Math.max(0,totalCount-visibleCount);
        var info=document.getElementById('cryptoFilterInfo');
        var sub=document.querySelector('.page-head .sub');
        var toggle=document.getElementById('toggleAllCryptoBtn');
        var label=showAllCrypto ? 'Tüm kripto paralar' : 'Majör kripto paralar';
        var infoText=label+' gösteriliyor: '+visibleCount+' / '+totalCount+' seri';
        if(info)info.textContent=infoText+(hiddenCount&&!showAllCrypto?' · '+hiddenCount+' kripto gizli':'');
        if(sub)sub.textContent=infoText;
        setMetaDescription('Bitcoin, Ethereum, Solana ve '+visibleCount+' görünür kripto para — anlık fiyatlar, grafikler ve Bitcoin ETF durumu');
        if(toggle){
            toggle.textContent=showAllCrypto ? 'Sadece majörleri göster' : 'Tüm kriptoları göster';
            toggle.setAttribute('aria-pressed', showAllCrypto ? 'true' : 'false');
            toggle.style.display=hiddenCount ? '' : 'none';
        }
        var daily=document.getElementById('dailyBarSubtitle');
        var monthly=document.getElementById('monthlyBarSubtitle');
        if(daily)daily.textContent=label+' — günlük % değişim';
        if(monthly)monthly.textContent=label+' — 1 aylık % değişim';
    }

    function renderPager(totalItems){
        var el=document.getElementById('cardsPager');if(!el)return;
        var totalPages=Math.max(1,Math.ceil(totalItems/PAGE_SIZE));
        var start=totalItems?((page-1)*PAGE_SIZE+1):0;
        var end=Math.min(totalItems,page*PAGE_SIZE);
        el.innerHTML=''+
            '<div class="pager-count">Gösterilen: <b>'+start+'-'+end+'</b> / '+totalItems+'</div>'+
            '<div class="pager-actions">'+
                '<button class="tf-btn" id="prevPageBtn" type="button" '+(page<=1?'disabled':'')+'>← Önceki</button>'+
                '<span class="pager-count">Sayfa '+page+' / '+totalPages+'</span>'+
                '<button class="tf-btn" id="nextPageBtn" type="button" '+(page>=totalPages?'disabled':'')+'>Sonraki →</button>'+
            '</div>';
        var prev=document.getElementById('prevPageBtn');
        var next=document.getElementById('nextPageBtn');
        if(prev)prev.addEventListener('click',function(){if(page>1){page--;rebuildCards();}});
        if(next)next.addEventListener('click',function(){if(page<totalPages){page++;rebuildCards();}});
    }

    function setChartsExpanded(nextState){
        chartsExpanded=nextState===true;
        var btn=document.getElementById('toggleChartsBtn');
        var tf=document.querySelector('.chart-timeframes.global-timeframes');
        var grid=document.getElementById('chartsGrid');
        if(btn){
            btn.setAttribute('aria-expanded', chartsExpanded ? 'true' : 'false');
            btn.textContent=chartsExpanded ? '📉 Grafikleri Kapat' : '📉 Grafikleri Aç';
        }
        if(tf)tf.style.display=chartsExpanded ? '' : 'none';
        if(grid)grid.style.display=chartsExpanded ? '' : 'none';
    }

    function rebuildCards(){
        destroyCharts();
        var s=document.getElementById('summaryCards');if(s)s.innerHTML='';
        var d=document.getElementById('dataTable');if(d)d.innerHTML='';
        if(!allSeries.length){renderPager(0);return;}
        var visible=paged(allSeries);
        renderPager(allSeries.length);
        PM.buildSummary('summaryCards',visible);
        PM.buildTable('dataTable',visible);
        if(chartsExpanded){ PM.ensureChartJs().then(function(){ chartInstances=PM.buildCharts('chartsGrid',visible,'all'); }); }
    }

    function rebuildBar(){
        if(barCharts.length){barCharts.forEach(function(c){if(c&&c.destroy)c.destroy()});} barCharts=[];
        PM.ensureChartJs().then(function(){
            var c1=PM.buildBarChart('perfBarDaily',allSeries,'change_1d_pct',15);
            var c2=PM.buildBarChart('perfBarMonthly',allSeries,'change_1m_pct',15);
            if(c1)barCharts.push(c1);if(c2)barCharts.push(c2);
        });
    }
    function rebuildHeatmap(){PM.buildHeatmap('heatmapContainer',allSeries);}
    function rebuildCurrent(){
        if(currentView==='cards')rebuildCards();
        else if(currentView==='bar')rebuildBar();
        else if(currentView==='heatmap')rebuildHeatmap();
    }

    function escapeHtml(value){
        return String(value==null?'':value).replace(/[&<>"']/g,function(ch){
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
        });
    }

    function formatEtfValue(value){
        if(value==null||value==='')return 'Kaynakta kontrol edin';
        return escapeHtml(value);
    }

    function renderBtcEtfStatus(data, isStale){
        var el=document.getElementById('btcEtfStatus');if(!el)return;
        var checked=data&&data.updated_at?escapeHtml(data.updated_at):'bilinmiyor';
        var source=data&&data.source_url?String(data.source_url):'';
        var sourceLink=source?'<a href="'+escapeHtml(source)+'" target="_blank" rel="noopener noreferrer" style="color:var(--accent);font-weight:700">Kaynak</a>':'Kaynak belirtilmedi';
        var warn=isStale?'<div style="padding:8px 12px;background:rgba(245,158,11,.12);border-bottom:1px solid var(--border);color:#f59e0b;font-size:.74rem;font-weight:700">⚠️ ETF verisi güncel olmayabilir.</div>':'';
        el.innerHTML='<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden">'+warn+
            '<div style="padding:9px 12px;color:var(--t3);font-size:.72rem;border-bottom:1px solid var(--border)">Manuel veri — son kontrol: '+checked+' · '+sourceLink+'</div>'+
            '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:400px;font-size:.78rem"><thead><tr style="background:var(--bg2)">'+
            '<th style="padding:8px 12px;text-align:left;font-size:.65rem;color:var(--t3);text-transform:uppercase;border-bottom:1px solid var(--border)">Gösterge</th>'+
            '<th style="padding:8px 12px;text-align:right;font-size:.65rem;color:var(--t3);text-transform:uppercase;border-bottom:1px solid var(--border)">Değer</th>'+
            '</tr></thead><tbody>'+
            '<tr><td style="padding:7px 12px;border-bottom:1px solid var(--border2)">Toplam Spot BTC ETF AUM</td><td style="padding:7px 12px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border2)">'+formatEtfValue(data&&data.total_aum)+'</td></tr>'+
            '<tr><td style="padding:7px 12px;border-bottom:1px solid var(--border2)">Günlük net akış</td><td style="padding:7px 12px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border2)">'+formatEtfValue(data&&data.daily_flow)+'</td></tr>'+
            '<tr><td style="padding:7px 12px">Durum</td><td style="padding:7px 12px;text-align:right;font-weight:700">'+formatEtfValue(data&&data.status_label)+'</td></tr>'+
            '</tbody></table></div></div>';
    }

    function loadBtcEtfStatus(){
        fetch('data/btc_etf_status.json?t='+Date.now(),{cache:'no-store'}).then(function(r){
            if(!r.ok)throw new Error('HTTP '+r.status);
            return r.json();
        }).then(function(data){
            renderBtcEtfStatus(data,false);
        }).catch(function(){
            renderBtcEtfStatus({updated_at:null,total_aum:null,daily_flow:null,status_label:'ETF verisi güncel olmayabilir',source_url:''},true);
        });
    }

    loadBtcEtfStatus();

    PM.loadData('crypto.json','kripto').then(function(data){
        if(!data||!data.series||!data.series.length){document.getElementById('summaryCards').innerHTML='<div class="scard"><div class="scard-name">Veri bulunamadı.</div></div>';renderPager(0);return}
        sourceSeries=data.series;
        refreshCryptoFilter();
        var ui=document.getElementById('updateInfo');
        if(ui&&data.meta)ui.textContent='Son güncelleme: '+new Date(data.meta.updated_at).toLocaleString('tr-TR')+' · '+data.meta.symbol_count+' seri';
        setChartsExpanded(false);
        rebuildCards();
    });

    var toggleAllCryptoBtn=document.getElementById('toggleAllCryptoBtn');
    if(toggleAllCryptoBtn)toggleAllCryptoBtn.addEventListener('click',function(){
        showAllCrypto=!showAllCrypto;
        refreshCryptoFilter();
        rebuildCurrent();
    });

    var chartsBtn=document.getElementById('toggleChartsBtn');
    if(chartsBtn)chartsBtn.addEventListener('click',function(){
        setChartsExpanded(!chartsExpanded);
        rebuildCards();
    });

    document.getElementById('viewToggle').addEventListener('click',function(e){
        var btn=e.target.closest('.view-btn');if(!btn)return;
        document.querySelectorAll('.view-btn').forEach(function(b){b.classList.remove('on')});
        btn.classList.add('on');
        currentView=btn.getAttribute('data-view');
        document.querySelectorAll('.view-section').forEach(function(s){s.classList.remove('active')});
        if(currentView==='cards')document.getElementById('viewCards').classList.add('active');
        else if(currentView==='bar')document.getElementById('viewBar').classList.add('active');
        else if(currentView==='heatmap')document.getElementById('viewHeatmap').classList.add('active');
        rebuildCurrent();
    });

    fetch('/api/ai-analysis?cat=kripto').then(function(r){return r.json()}).then(function(d){
        var el=document.getElementById('aiAnalysis');if(el&&window.PM&&PM.renderAiAnalysis)PM.renderAiAnalysis(el,d);else if(el&&d.analysis)el.textContent=d.analysis;
    }).catch(function(){var el=document.getElementById('aiAnalysis');if(el)el.innerHTML='<span class="ai-loading">Analiz yüklenemiyor.</span>'});
})();
</script>
</body>
</html>
