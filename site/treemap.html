<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3b82f6">
<title>Piyasa Haritası — Risk Monitörü</title>
<meta name="description" content="Tüm piyasa tek bakışta — Finviz tarzı treemap: hisseler, emtialar, kriptolar canlı renkli mozaik">
<meta property="og:title" content="Piyasa Haritası — Risk Monitörü">
<meta property="og:description" content="Tüm piyasa tek bakışta — Finviz tarzı treemap">
<meta property="og:type" content="website">
<meta property="og:locale" content="tr_TR">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.tm-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tm-btn{padding:6px 12px;border:1px solid #dde4ed;border-radius:999px;background:#fff;color:#475569;font-size:.72rem;font-weight:700;cursor:pointer;transition:.15s}
.tm-btn:hover{border-color:#3b82f6;color:#3b82f6}
.tm-btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
.tm-search{flex:1;min-width:180px;padding:6px 12px;border:1px solid #dde4ed;border-radius:999px;font-size:.75rem;color:#475569}
.tm-search:focus{outline:none;border-color:#3b82f6}

.tm-legend{display:flex;align-items:center;gap:4px;margin-left:auto;font-size:.68rem;color:#64748b}
.tm-legend-gradient{width:180px;height:8px;border-radius:4px;background:linear-gradient(to right,#dc2626 0%,#f87171 25%,#e5e7eb 50%,#86efac 75%,#16a34a 100%);border:1px solid #d1d5db}

.tm-wrap{background:#0b1220;border:1px solid #1e293b;border-radius:12px;padding:4px;margin-bottom:16px;position:relative;overflow:hidden}
#treemap{width:100%;height:640px;position:relative}
@media(max-width:768px){#treemap{height:520px}}

.tm-cell{position:absolute;overflow:hidden;border:1px solid rgba(0,0,0,.2);transition:transform .18s ease-out,box-shadow .18s ease-out;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tm-cell:hover{transform:scale(1.04);z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.5);border-color:#fff}
.tm-cell .tm-sym{font-size:.78rem;letter-spacing:.02em;line-height:1.1}
.tm-cell .tm-pct{font-size:.7rem;font-weight:800;opacity:.95;font-family:'JetBrains Mono',monospace;line-height:1.15;margin-top:2px}
.tm-cell.small .tm-pct{display:none}
.tm-cell.tiny .tm-sym{font-size:.6rem}
.tm-cell.tiny .tm-pct{display:none}

.tm-group-lbl{position:absolute;top:0;left:0;right:0;padding:3px 6px;font-size:.58rem;font-weight:800;color:rgba(255,255,255,.6);letter-spacing:.08em;text-transform:uppercase;pointer-events:none;z-index:5}

.tm-pulse{animation:tmPulse 1.5s ease-out}
@keyframes tmPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}

.tm-tooltip{position:fixed;background:rgba(15,23,42,.96);backdrop-filter:blur(8px);border:1px solid #3b82f6;border-radius:10px;padding:10px 14px;color:#e2e8f0;font-size:.75rem;pointer-events:none;z-index:999;display:none;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tm-tooltip .tt-title{font-size:.9rem;font-weight:800;color:#fbbf24;margin-bottom:4px}
.tm-tooltip .tt-row{display:flex;justify-content:space-between;gap:10px;margin:2px 0}
.tm-tooltip .tt-row span:first-child{color:#94a3b8;font-size:.68rem}
.tm-tooltip .tt-pct{font-family:'JetBrains Mono',monospace;font-weight:700}
.tm-tooltip .tt-spark{margin-top:6px;height:30px}

.tm-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tm-sum-card{background:#fff;border:1px solid #dde4ed;border-radius:10px;padding:10px 12px}
.tm-sum-card .tms-v{font-size:1.1rem;font-weight:800;font-family:'JetBrains Mono',monospace}
.tm-sum-card .tms-l{font-size:.6rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;font-weight:700}

.tm-top-lists{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
@media(max-width:640px){.tm-top-lists{grid-template-columns:1fr}}
.tm-list{background:#fff;border:1px solid #dde4ed;border-radius:10px;padding:10px 12px}
.tm-list h4{font-size:.75rem;margin-bottom:8px;color:#334155}
.tm-list .tl-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f1f5f9;font-size:.72rem}
.tm-list .tl-row:last-child{border:none}
.tm-list .tl-sym{font-weight:700}
.tm-list .tl-pct{font-family:'JetBrains Mono',monospace;font-weight:700}
.tl-pct.u{color:#16a34a}.tl-pct.d{color:#dc2626}

.page-title-badge{display:inline-block;margin-left:8px;padding:2px 8px;background:#3b82f6;color:#fff;border-radius:10px;font-size:.6rem;font-weight:700;vertical-align:middle}
</style>
</head>
<body>
<script src="assets/js/sidebar.js"></script>
<div class="page">
<div class="page-spacer"></div>
<div class="page-head"><h1>🗂️ Piyasa Haritası <span class="page-title-badge">CANLI</span></h1></div>

<div class="tm-summary">
    <div class="tm-sum-card"><div class="tms-v" id="tmTotal">0</div><div class="tms-l">Varlık</div></div>
    <div class="tm-sum-card"><div class="tms-v" id="tmUp" style="color:#16a34a">0</div><div class="tms-l">Yükselen</div></div>
    <div class="tm-sum-card"><div class="tms-v" id="tmDn" style="color:#dc2626">0</div><div class="tms-l">Düşen</div></div>
    <div class="tm-sum-card"><div class="tms-v" id="tmAvg">0%</div><div class="tms-l">Ortalama</div></div>
    <div class="tm-sum-card"><div class="tms-v" id="tmBreadth">—</div><div class="tms-l">Piyasa Genişliği</div></div>
</div>

<div class="tm-controls">
    <button class="tm-btn active" data-filter="all">Tümü</button>
    <button class="tm-btn" data-filter="stocks">Hisseler</button>
    <button class="tm-btn" data-filter="comm">Emtialar</button>
    <button class="tm-btn" data-filter="fx">Döviz</button>
    <button class="tm-btn" data-filter="crypto">Kripto</button>
    <button class="tm-btn" data-filter="idx">Endeksler</button>
    <input class="tm-search" id="tmSearch" type="search" placeholder="🔍 Sembol/isim ara..." />
    <div class="tm-legend">
        <span>-5%</span><div class="tm-legend-gradient"></div><span>+5%</span>
    </div>
</div>

<div class="tm-wrap"><div id="treemap"></div></div>

<div class="tm-top-lists">
    <div class="tm-list"><h4>🚀 En Çok Yükselenler (Top 10)</h4><div id="tmGainers"></div></div>
    <div class="tm-list"><h4>📉 En Çok Düşenler (Top 10)</h4><div id="tmLosers"></div></div>
</div>

<div class="chart-box">
    <div class="chart-title">🤖 AI Piyasa Nabzı</div>
    <div id="tmAi" style="font-size:.82rem;line-height:1.6;color:#475569;white-space:pre-line">Yükleniyor...</div>
</div>

<div class="tm-tooltip" id="tmTip"></div>

</div>
<script src="assets/js/treemap.js"></script>
</body>
</html>
