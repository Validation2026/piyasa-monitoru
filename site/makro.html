    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

<nav class="nav">
    <a class="nav-brand" href="index.html">📊 Piyasa Monitörü</a>
    <div class="nav-links">
        <a href="index.html">Panel</a>

    </div>
    <div class="nav-spacer"></div>
    <span class="nav-clock" id="clock"></span>
    <button class="theme-btn" id="themeToggle">🌙</button>
</nav>

<div class="page">
    <div class="page-head">
        <div class="breadcrumb"><a href="index.html">Ana Sayfa</a> › Türkiye Makro</div>
        <h1>🏦 Türkiye Makro Verileri</h1>
        <div class="sub">TÜFE, faiz oranları, tüketici güveni, TCMB döviz kurları — EVDS verisi</div>
        <div class="update-info" id="updateInfo">Yükleniyor...</div>
    </div>

    <!-- Summary Cards -->
    <div class="summary-row" id="summaryCards"></div>

    <!-- Charts -->
    <div class="charts" id="chartsGrid"></div>

    <!-- Table -->
    <div class="dtable" id="dataTable"></div>

    <div class="footer">
        <span>Piyasa Monitörü © 2026</span>
        <a href="index.html">Ana Sayfa</a>
        <span style="color:var(--t3)">Kaynak: TCMB EVDS</span>
    </div>
</div>

<script src="assets/js/app.js"></script>
<script>
(function(){
    'use strict';

    PM.fj('macro_turkey.json').then(function(data){
        if(!data||!data.series||!data.series.length){
            document.getElementById('summaryCards').innerHTML='<div class="scard"><div class="scard-name">Veri bulunamadı. TCMB collector çalıştırın.</div></div>';
            return;
        }
        var all=data.series;

        // Update info
        var ui=document.getElementById('updateInfo');
        if(ui&&data.meta)ui.textContent='Son güncelleme: '+new Date(data.meta.updated_at).toLocaleString('tr-TR')+' · '+data.meta.series_count+' seri';

        // Summary cards
        var cardsHtml='';
        all.forEach(function(s,i){
            var chgs='';
            if(s.change_prev_pct!=null)chgs+=PM.fc(s.change_prev_pct)+'<span class="chg-label">Önceki</span> ';
            if(s.change_ytd_pct!=null)chgs+=PM.fc(s.change_ytd_pct)+'<span class="chg-label">YTD</span> ';
            if(s.change_yoy_pct!=null)chgs+=PM.fc(s.change_yoy_pct)+'<span class="chg-label">YoY</span> ';
            var sid='macro-spark-'+i;
            cardsHtml+='<div class="scard fade-in" style="animation-delay:'+(.05*i)+'s"><div class="scard-name">'+s.name+'</div><div class="scard-price">'+PM.fp(s.current,2)+'</div><div class="scard-chgs">'+chgs+'</div><div class="scard-range">'+s.category+' · Son: '+s.latest_date+'</div><div class="scard-spark"><canvas id="'+sid+'"></canvas></div></div>';
        });
        document.getElementById('summaryCards').innerHTML=cardsHtml;

        // Sparklines
        setTimeout(function(){
            all.forEach(function(s,i){
                if(s&&s.data)PM.miniSpark('macro-spark-'+i,s.data,PM.gc(i));
            });
        },50);

        // Charts
        var grid=document.getElementById('chartsGrid');grid.innerHTML='';
        all.forEach(function(s,i){
            var cid='chart-macro-'+i;
            var card=document.createElement('div');card.className='chrt fade-in';card.style.animationDelay=(.05*i)+'s';
            card.innerHTML='<div class="chrt-title">'+s.name+'</div><div class="chrt-sub"><span class="live">'+PM.fp(s.current)+' — '+s.category+'</span></div><canvas id="'+cid+'"></canvas>';
            grid.appendChild(card);
            PM.makeChart(cid,{name:s.name,unit:'',data:s.data},{color:PM.gc(i),period:'all'});
        });

        // Table
        var th='<table><thead><tr><th>Seri</th><th>Kategori</th><th class="r">Son Değer</th><th class="r">Son Tarih</th><th class="r">Önceki</th><th class="r">Veri</th></tr></thead><tbody>';
        all.forEach(function(s){
            var cls=PM.cc(s.change_prev_pct);
            var chg=s.change_prev_pct!=null?(s.change_prev_pct>=0?'+':'')+s.change_prev_pct.toFixed(2)+'%':'—';
            th+='<tr><td>'+s.name+'</td><td class="dim">'+s.category+'</td><td class="mono r">'+PM.fp(s.current)+'</td><td class="mono r dim">'+s.latest_date+'</td><td class="mono r '+cls+'">'+chg+'</td><td class="mono r dim">'+s.data.length+'</td></tr>';
        });
        th+='</tbody></table>';
        document.getElementById('dataTable').innerHTML=th;
    });
})();
</script>
</body>
</html>
