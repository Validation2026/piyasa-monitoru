<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performans Raporu — Piyasa Monitörü</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
.ai-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:22px;border-top:3px solid var(--purple)}
.ai-body{font-size:.82rem;color:var(--t2);line-height:1.7;white-space:pre-wrap}
.perf-table{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow-x:auto;margin-bottom:22px;-webkit-overflow-scrolling:touch}
.perf-table table{width:100%;border-collapse:collapse;min-width:700px}
.perf-table th{text-align:left;padding:10px 12px;font-size:.65rem;color:var(--t3);text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--bg2);font-weight:700}
.perf-table th.r{text-align:right}
.perf-table td{padding:8px 12px;font-size:.8rem;border-bottom:1px solid var(--border2)}
.perf-table tr:hover td{background:var(--card2)}
.perf-table .mono{font-family:var(--mono);font-weight:600}
.perf-table .r{text-align:right}
.perf-table .u{color:#00d68f}.perf-table .d{color:#ff4757}.perf-table .dim{color:var(--t3)}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:22px}
.chart-box h3{font-size:.85rem;font-weight:700;margin-bottom:12px}
.chart-box canvas{width:100%!important;height:280px!important}
@media(max-width:768px){.chart-box canvas{height:200px!important}}
</style>
</head>
<body>
<script src="assets/js/sidebar.js"></script>
<div class="page">
<div class="page-head"><h1>📊 Performans Raporu</h1></div>

<div class="ai-box"><div style="font-size:.82rem;font-weight:700;margin-bottom:8px">🤖 Analiz</div><div class="ai-body" id="aiBox">Yükleniyor...</div></div>

<div class="sec-title">📈 Sektör Bazlı Performans</div>
<div class="chart-box"><h3>Kategorilere Göre Günlük Ortalama Değişim</h3><canvas id="sectorChart"></canvas></div>

<div class="sec-title">🏆 En İyi ve En Kötü Performanslar</div>
<div class="perf-table"><table id="perfTable"></table></div>

<div class="footer">Piyasa Monitörü © 2026</div>
</div>
<script src="assets/js/app.js"></script>
<script>
(function(){
var D='data/';
function fj(f){return fetch(D+f+'?t='+Date.now()).then(function(r){return r.json()}).catch(function(){return null})}
function fp(v){if(v==null)return'—';return Number(v).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})}

var files=[
    {f:'commodities_energy.json',cat:'Enerji'},
    {f:'commodities_metals.json',cat:'Madenler'},
    {f:'commodities_agriculture.json',cat:'Tarım'},
    {f:'industrial.json',cat:'Sanayi'},
    {f:'currencies.json',cat:'Döviz'},
    {f:'bonds.json',cat:'Tahvil'},
    {f:'indices.json',cat:'Endeks'},
    {f:'crypto.json',cat:'Kripto'}
];

Promise.all(files.map(function(fi){return fj(fi.f)})).then(function(results){
    var all=[];var sectorAvg={};
    results.forEach(function(data,i){
        if(!data||!data.series)return;
        var cat=files[i].cat;
        if(!sectorAvg[cat])sectorAvg[cat]={sum:0,count:0};
        data.series.forEach(function(s){
            s._cat=cat;
            all.push(s);
            if(s.change_1d_pct!=null){sectorAvg[cat].sum+=s.change_1d_pct;sectorAvg[cat].count++}
        });
    });

    // Sector chart
    var cats=Object.keys(sectorAvg);
    var avgs=cats.map(function(c){return sectorAvg[c].count?sectorAvg[c].sum/sectorAvg[c].count:0});
    var colors=avgs.map(function(v){return v>=0?'rgba(0,214,143,.7)':'rgba(255,71,87,.7)'});
    new Chart(document.getElementById('sectorChart'),{type:'bar',data:{labels:cats,datasets:[{data:avgs,backgroundColor:colors,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return(c.raw>=0?'+':'')+c.raw.toFixed(2)+'%'}}}},scales:{x:{grid:{color:'rgba(0,0,0,.05)'},ticks:{callback:function(v){return v+'%'}}},y:{grid:{display:false}}}}});

    // Performance table
    var sorted=all.filter(function(s){return s.change_1d_pct!=null}).sort(function(a,b){return b.change_1d_pct-a.change_1d_pct});
    var t=document.getElementById('perfTable');
    var h='<thead><tr><th>#</th><th>Varlık</th><th>Kategori</th><th class="r">Fiyat</th><th class="r">1 Gün</th><th class="r">1 Hafta</th><th class="r">1 Ay</th><th class="r">YTD</th></tr></thead><tbody>';
    sorted.forEach(function(s,i){
        function cv(p){if(p==null)return'<td class="mono r dim">—</td>';return'<td class="mono r '+(p>=0?'u':'d')+'">'+(p>=0?'+':'')+p.toFixed(2)+'%</td>'}
        h+='<tr><td class="dim">'+(i+1)+'</td><td class="mono" style="font-weight:700">'+s.name+'</td><td class="dim">'+s._cat+'</td><td class="mono r">'+fp(s.current)+'</td>'+cv(s.change_1d_pct)+cv(s.change_1w_pct)+cv(s.change_1m_pct)+cv(s.change_ytd_pct)+'</tr>';
    });
    h+='</tbody>';t.innerHTML=h;
});

fetch('/api/ai-analysis?cat=genel').then(function(r){return r.json()}).then(function(d){
    if(d.analysis)document.getElementById('aiBox').textContent=d.analysis;
}).catch(function(){});
})();
</script>
</body>
</html>
