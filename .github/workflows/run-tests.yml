name: Run Tests

on:
  push:
    branches: [main]
    paths:
      - 'collectors/**'
      - 'netlify/functions/**'
      - 'tests/**'
      - 'site/assets/js/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          pip install requests pandas

      - name: Run Python tests
        run: python -m pytest tests/python/ -v --tb=short

  javascript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npx jest --verbose
