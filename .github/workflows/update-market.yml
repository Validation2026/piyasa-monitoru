name: Update Market Data

on:
  schedule:
    # Hafta içi (Pazartesi-Cuma) TSİ 09:00 - 18:00 arası her 5 dakikada bir (UTC 06:00 - 15:00)
    - cron: '*/5 6-15 * * 1-5'
    # Hafta sonu (Cumartesi-Pazar) TSİ 09:00 - 18:00 arası her 3 saatte bir (UTC 06:00, 09:00, 12:00, 15:00)
    - cron: '0 6-15/3 * * 0,6'
  workflow_dispatch:  # Manuel tetikleme butonu

jobs:
  update-yahoo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r collectors/requirements.txt

      - name: Run Yahoo Finance collector
        run: python collectors/yahoo_finance.py

      - name: Copy data to site
        run: |
          mkdir -p site/data
          cp data/*.json site/data/

      - name: Commit & Push
        run: |
          git config user.name "Market Data Bot"
          git config user.email "bot@piyasa-monitoru.dev"
          git add data/ site/data/
          git diff --staged --quiet || git commit -m "📊 Piyasa verileri güncellendi [$(date -u +%Y-%m-%d\ %H:%M)]"
          git push
