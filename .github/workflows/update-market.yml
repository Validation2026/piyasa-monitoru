name: Update Market Data

on:
  push:
    branches: [main]
  schedule:
    # Her 10 dakikada bir tetiklenir; saat/gun filtresi script icinde TR saatine gore
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: update-market
  cancel-in-progress: false

jobs:
  update-yahoo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Time window check (TR saati 08-18)
        id: window
        if: github.event_name == 'schedule'
        run: |
          HOUR=$(TZ='Europe/Istanbul' date +%H)
          DOW=$(TZ='Europe/Istanbul' date +%u)   # 1=Pzt ... 7=Pzr
          MIN=$(TZ='Europe/Istanbul' date +%M)
          echo "TR hour=$HOUR dow=$DOW min=$MIN"

          # 08-18 disindaysa atla
          if [ "$HOUR" -lt 8 ] || [ "$HOUR" -gt 18 ]; then
            echo "Saat penceresi disinda. Atlaniyor."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Hafta sonu (Cmt=6, Pzr=7): sadece 4 saatte bir (08, 12, 16) ve dakika < 11
          if [ "$DOW" -ge 6 ]; then
            REM=$(( (HOUR - 8) % 4 ))
            if [ "$REM" -ne 0 ] || [ "$MIN" -ge 11 ]; then
              echo "Hafta sonu 4 saatlik dilim disinda. Atlaniyor."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Checkout repo
        if: github.event_name != 'schedule' || steps.window.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: github.event_name != 'schedule' || steps.window.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.window.outputs.skip != 'true'
        run: pip install -r collectors/requirements.txt

      - name: Run Yahoo Finance collector
        if: github.event_name != 'schedule' || steps.window.outputs.skip != 'true'
        run: python collectors/yahoo_finance.py

      - name: Copy data to site
        if: github.event_name != 'schedule' || steps.window.outputs.skip != 'true'
        run: |
          mkdir -p site/data
          cp data/*.json site/data/

      - name: Commit & Push
        if: github.event_name != 'schedule' || steps.window.outputs.skip != 'true'
        run: |
          git config user.name "Market Data Bot"
          git config user.email "bot@piyasa-monitoru.dev"
          git add data/ site/data/
          git diff --staged --quiet || git commit -m "📊 Piyasa verileri güncellendi [$(TZ='Europe/Istanbul' date +%Y-%m-%d\ %H:%M)]"
          git push
