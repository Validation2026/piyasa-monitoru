name: Update Market Data

on:
  push:
    branches: [main]
    paths:
      - 'collectors/yahoo_finance.py'
      - 'collectors/config.py'
      - 'collectors/requirements.txt'
      - '.github/workflows/update-market.yml'
  schedule:
    # TR (UTC+3): hafta ici 08:07–18:07, saat basi.
    # Hafta sonu 08:07, 12:07, 16:07; API/yayin maliyetini sinirla.
    - cron: '7 5-15 * * 1-5'
    - cron: '7 5,9,13 * * 0,6'
  workflow_dispatch:

concurrency:
  group: update-market
  cancel-in-progress: false

jobs:
  update-yahoo:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r collectors/requirements.txt

      - name: Validate refresh safety before collection
        run: python -m unittest discover -s tests/python -p test_market_safety.py

      - name: Run Yahoo Finance collector
        run: python collectors/yahoo_finance.py

      - name: Copy only Yahoo market data to site
        run: |
          mkdir -p site/data
          for name in commodities_energy commodities_metals commodities_agriculture industrial currencies bonds indices crypto stocks summary activities; do
            cp "data/$name.json" "site/data/$name.json"
            git add "data/$name.json" "site/data/$name.json"
          done

      - name: Commit & Push
        run: |
          git config user.name "Market Data Bot"
          git config user.email "bot@piyasa-monitoru.dev"
          if git diff --staged --quiet; then
            echo "No market data changes; no new deploy required."
            exit 0
          fi
          git commit -m "📊 Piyasa verileri güncellendi [$(TZ='Europe/Istanbul' date '+%Y-%m-%d %H:%M')]"
          # TCMB/snapshot/admin commits may arrive while collecting.
          # Rebase only; do not force-push or resolve competing data automatically.
          for attempt in 1 2 3 4 5 6; do
            git fetch --no-tags origin main
            git rebase FETCH_HEAD
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced; retry $attempt"
            sleep 3
          done
          echo "Market update could not be published safely."
          exit 1
