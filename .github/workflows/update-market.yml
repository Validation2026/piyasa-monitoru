name: Update Market Data

on:
  schedule:
    # Her 15 dakikada bir (UTC) — piyasa saatlerinde
    # TR saati = UTC+3, NYSE 16:30-23:00 TR, piyasalar genel 08:00-00:00 TR
    - cron: '*/15 5-21 * * 1-5'   # Hafta içi 08:00-00:00 TR
    - cron: '0 */4 * * 0,6'       # Hafta sonu her 4 saatte (emtia/kripto)
  workflow_dispatch:  # Manuel tetikleme butonu

jobs:
  update-yahoo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r collectors/requirements.txt

      - name: Run Yahoo Finance collector
        run: python collectors/yahoo_finance.py

      - name: Copy data to site
        run: |
          mkdir -p site/data
          cp data/*.json site/data/

      - name: Commit & Push
        run: |
          git config user.name "Market Data Bot"
          git config user.email "bot@piyasa-monitoru.dev"
          git add data/ site/data/
          git diff --staged --quiet || git commit -m "📊 Piyasa verileri güncellendi [$(date -u +%Y-%m-%d\ %H:%M)]"
          git push
