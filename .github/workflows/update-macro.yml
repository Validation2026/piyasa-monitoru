name: Update TCMB Macro Data

on:
  schedule:
    - cron: '30 7 * * 1-5'  # Hafta içi her gün 10:30 TR (07:30 UTC)
  workflow_dispatch:

jobs:
  update-evds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r collectors/requirements.txt

      - name: Run TCMB EVDS collector
        env:
          TCMB_API_KEY: ${{ secrets.TCMB_API_KEY }}
          TCMB_EVDS_KEY: ${{ secrets.TCMB_EVDS_KEY }}
        run: python collectors/tcmb_makro.py

      - name: Copy data to site
        run: |
          mkdir -p site/data
          cp data/*.json site/data/

      - name: Commit & Push
        run: |
          git config user.name "Market Data Bot"
          git config user.email "bot@piyasa-monitoru.dev"
          git add data/ site/data/
          git diff --staged --quiet || git commit -m "🏦 TCMB makro verileri güncellendi [$(date -u +%Y-%m-%d)]"
          git push
