name: Update TCMB Macro Data

on:
  push:
    branches: [main]
    paths:
      - 'collectors/tcmb_makro.py'
      - '.github/workflows/update-macro.yml'
  schedule:
    - cron: '30 7 * * 1-5'  # Hafta içi her gün 10:30 TR (07:30 UTC)
  workflow_dispatch:

jobs:
  update-evds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r collectors/requirements.txt

      - name: Run TCMB EVDS collector
        id: macro_collect
        continue-on-error: true # Persist safe no-data status, then report run as failed.
        env:
          TCMB_API_KEY: ${{ secrets.TCMB_API_KEY }}
          TCMB_EVDS_KEY: ${{ secrets.TCMB_EVDS_KEY }}
        run: python collectors/tcmb_makro.py

      - name: Copy data to site
        run: |
          mkdir -p site/data
          cp data/turkiye_makro.json site/data/turkiye_makro.json

      - name: Commit & Push
        run: |
          git config user.name "Market Data Bot"
          git config user.email "bot@piyasa-monitoru.dev"
          git add data/turkiye_makro.json site/data/turkiye_makro.json
          git diff --staged --quiet || git commit -m "🏦 TCMB makro verileri güncellendi [$(date -u +%Y-%m-%d)]"
          git push || (git pull --rebase && git push)

      - name: Fail job when live TCMB collection failed
        if: steps.macro_collect.outcome == 'failure'
        run: |
          echo 'TCMB EVDS canlı verisi alınamadı. Yapay veri oluşturulmadı; son doğrulanmış gözlem / veri yok durumları kaydedildi.'
          exit 1
