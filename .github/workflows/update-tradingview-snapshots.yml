name: Update TradingView Snapshots

on:
  # Workflow henüz main'e alınmadan feature branch üzerinde doğrulanabilsin.
  # Snapshot'ın oluşturduğu yalnızca data/ değişiklikleri yeni bir çalışmayı
  # tetiklemez; böylece bot commit'i sonsuz döngü oluşturmaz.
  push:
    paths:
      - '.github/workflows/update-tradingview-snapshots.yml'
      - 'collectors/tradingview_snapshot.py'
      - 'collectors/tradingview_symbols.json'
      - 'collectors/requirements.txt'
  schedule:
    # Türkiye UTC+3 kullanır; 04:00 UTC her gün 07:00 Türkiye saatidir.
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: update-tradingview-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Playwright
        run: |
          pip install -r collectors/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Capture TradingView snapshots
        run: python collectors/tradingview_snapshot.py

      - name: Upload diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingview-diagnostics
          path: artifacts/tradingview/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit and push snapshots
        run: |
          git config user.name "Market Data Bot"
          git config user.email "bot@piyasa-monitoru.dev"
          git add data/ site/data/
          git diff --staged --quiet || git commit -m "📈 TradingView sabah snapshotları güncellendi"
          git push
