[build]
  # Statik uygulamanın index.html dosyası repo kökünde değil site/ altındadır.
  # Bu ayar UI'daki site ayarından bağımsız olarak main ve branch deploy'larında
  # aynı yayın klasörünün kullanılmasını sağlar.
  publish = "site"

[functions]
  directory = "netlify/functions"
  # The Turkey risk API reads this snapshot at runtime; include it in the deploy bundle.
  included_files = ["site/data/turkiye_makro.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
